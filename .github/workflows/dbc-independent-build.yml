name: Build DBC Independent demo APK
on:
  push:
    branches: [kemetdbc-independent]
    paths: ['kemetdbc-independent/**', '.github/workflows/dbc-independent-build.yml']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [[ -z "$SDKMGR" ]]; then echo 'No sdkmanager present'; exit 1; fi
          yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMGR" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build independently namespaced APK
        working-directory: kemetdbc-independent
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DBC-Independent-1.1.0-debug-APK
          path: kemetdbc-independent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error