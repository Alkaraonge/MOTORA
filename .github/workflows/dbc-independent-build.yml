name: Build DBC Independent demo APK
on:
  push:
    branches: [kemetdbc-independent]
    paths: ['kemetdbc-independent/**', '.github/workflows/dbc-independent-build.yml']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build independently namespaced APK
        working-directory: kemetdbc-independent
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DBC-Independent-1.1.0-debug-APK
          path: kemetdbc-independent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error