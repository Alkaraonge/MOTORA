name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motora-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --build-name=1.0.0 --build-number=1

      - name: Prepare named APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk MOTORA-v1.0.0-build.1.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOTORA-v1.0.0-build.1
          path: MOTORA-v1.0.0-build.1.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish installable pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.1
          name: MOTORA 1.0.0 (Build 1)
          body: |
            نسخة Android تجريبية جاهزة للتثبيت.

            - Version: 1.0.0
            - Build: 1
            - Package: com.motora.motora
            - Build type: Debug APK
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: MOTORA-v1.0.0-build.1.apk
