name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zaid-cars-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build signed release APK for Samsung
        env:
          ORG_GRADLE_PROJECT_customApplicationId: com.zaidcars.zaid_cars_app.functional
          ORG_GRADLE_PROJECT_customAppLabel: زيد للسيارات التشغيلي
        run: flutter build apk --release --target-platform android-arm64 --build-name=1.0.38 --build-number=2038

      - name: Prepare named APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Zaid-Cars-v1.0.38-build.2038-Samsung.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaid-Cars-v1.0.38-build.2038-Samsung
          path: Zaid-Cars-v1.0.38-build.2038-Samsung.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish installable pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.38-build.2038
          name: زيد للسيارات 1.0.38 (Build 2038)
          body: |
            نسخة Android تجريبية تشغيلية جاهزة للتثبيت.

            - Version: 1.0.38
            - Build: 2038
            - Package: com.zaidcars.zaid_cars_app.functional
            - Architecture: arm64-v8a (Samsung)
            - Build type: Release APK
            - Stable test signature for future APK updates
            - Functional local database with add, edit, delete, payments, reports, backup, and CSV export
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: Zaid-Cars-v1.0.38-build.2038-Samsung.apk
