.overlay{position:absolute;inset:48px 0 58px;background:#0009;z-index:5;display:none}.overlay.open{display:block}.sidebar{position:absolute;left:0;top:48px;bottom:58px;width:296px;background:linear-gradient(110deg,#14233f,#090f23);border-right:1px solid #37476e;z-index:6;overflow-y:auto;transform:translateX(-101%);transition:transform .18s}.sidebar.open{transform:translateX(0)}.brand{padding:17px;background:linear-gradient(120deg,#213b73,#0f1830)}.brand h2{font-size:16px;letter-spacing:1.4px;margin:0 0 3px}.brand p{color:#8ea8d3;font-size:10px;margin:0}.group{padding:12px 12px 5px;font-size:9px;letter-spacing:.7px;font-weight:700;color:#4ac9fd}.navitem{display:flex;width:calc(100% - 20px);margin:4px 10px;background:#1a2e51;align-items:center;border-radius:3px;text-align:left;gap:12px;padding:10px 13px;font-size:12px;color:#e7f0ff}.navitem.active{background:#254876;color:#5bdbff;font-weight:700}.navicon{font-size:15px;color:#93aace}.navitem small{font-size:9px;margin-left:auto;color:#b9c4d6}
.pagebody{height:calc(100% - 70px);min-height:430px;overflow-y:auto}.statusline{height:32px;background:#0b1b28;border:1px solid #19374d;border-radius:9px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;font-size:10px;color:var(--cyan);letter-spacing:.6px;margin-bottom:8px}.statusline span:last-child{color:#ffba5f}.box{background:linear-gradient(140deg,#0b1b2a,#070e20);border:1px solid #24334e;border-radius:12px;padding:15px;margin-bottom:9px}.boxtitle{font-size:10px;letter-spacing:1px;color:#4bc7fa;font-weight:700;margin-bottom:12px}.smallmuted{font-size:11px;color:#8298ba}.battop{display:grid;grid-template-columns:160px 1fr;gap:17px;min-height:190px}.ring{width:145px;height:145px;border-radius:50%;background:conic-gradient(#14da9a 0 49%,#1a3047 49% 100%);margin:6px auto;display:grid;place-items:center}.ring>div{width:122px;height:122px;border-radius:50%;display:grid;align-content:center;justify-items:center;background:#081321}.ring b{font-size:36px;color:#22e6aa}.ring small{font-size:10px;color:#28d19d}.bars{display:flex;height:10px;margin:10px 0 7px;border-radius:8px;overflow:hidden;background:#1e2b44}.bars span:nth-child(1){background:#bf3654;flex:1}.bars span:nth-child(2){background:#e9af39;flex:1.3}.bars span:nth-child(3){background:#12ad78;flex:2.2}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:14px}.kpi{padding:10px;background:#081421;border:1px solid #182d48;border-radius:8px;font-size:10px;color:#839ab6}.kpi strong{display:block;font-size:17px;color:#ddecff;margin-top:5px}.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.batterybox .measure{display:flex;align-items:center;justify-content:space-between}.batterybox .measure strong{font-size:17px;color:#20da9b}.meterlabels{display:flex;justify-content:space-between;color:#6f82a4;font-size:9px}.featurewarn{font-size:12px;color:#ffcb6b;background:#231d20;border:1px solid #4a332e;padding:10px;border-radius:9px;margin-bottom:10px}
.tripgrid{display:grid;grid-template-columns:31% 1fr;gap:13px;height:92%}.tripstat{display:flex;flex-direction:column}.bigvalue{font-size:24px;font-weight:700;margin:13px 0 0}.cta{margin-top:auto;width:100%;background:#11bf95;color:#001b19;font-weight:bold;border-radius:9px;padding:12px;font-size:12px}.cta.secondary{background:#182238;color:#8292aa;border:1px solid #2f3b56;margin-top:8px}.tablewrap{overflow:auto}.tab{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px}.tab button{color:#9cacc7;font-size:11px;letter-spacing:1px;padding:8px 15px;border-bottom:2px solid transparent}.tab button.active{color:var(--cyan);border-color:var(--cyan)}table{width:100%;border-collapse:collapse;font-size:10px;text-align:left}td,th{padding:10px 7px;border-bottom:1px solid #162340}th{color:#8eabc6}td{color:#d3deec}td.ok{color:#14ce91}.tripbadge{font-size:10px;color:#29b980;padding:7px 11px;border-radius:7px;background:#0b3027}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ctl{background:#101831;border:1px solid #273758;border-radius:9px;min-height:65px;padding:12px}.ctl span{color:#88a0bd;font-size:11px}.ctl strong{display:block;color:#a887e5;margin-top:8px;font-size:12px}.settingrow{display:flex;align-items:center;justify-content:space-between;padding:12px 9px;border-bottom:1px solid #1e2d44;color:#cedbee;font-size:12px}.switch{width:33px;height:18px;border-radius:14px;background:#334360;position:relative}.switch:after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#8c9ab0;left:2px;top:2px}.switch.on{background:#463b83}.switch.on:after{background:#a66aff;left:17px}

<body><div class="shell"><header class="top"><div class="left"><button class="hamb" id="hamb" aria-label="Open menu">☰</button><span class="page-title" id="ptitle">Home Workspace</span></div><div class="center"><span>🛡 AEB</span> DEMO ONLY</div><span class="label" style="color:#ffbd69">NO VEHICLE LINK • DEMO</span></header><main class="main" id="main"></main><div class="footerwarn">Reference-style interface • Visual demonstration only <strong>No live BYD connection or vehicle control</strong></div><nav class="bottom"><button data-go="home" title="Back">↩</button><button data-go="home" title="Home">⌂</button><button data-go="modem" title="Phone">♧</button><button class="disabled" title="Climate not connected">‹</button><button class="temp" title="Climate not connected">23°<small>C</small></button><button class="disabled">›</button><button data-go="settings" title="Settings">⚙</button><button data-go="energy" title="Energy">≋</button><button class="disabled" title="Seat control unavailable">♨</button><button data-go="trip" title="Trips">◫</button><button class="disabled" title="Vehicle power unavailable">⏻</button><button data-go="home" title="Home">‹</button><button class="temp">23°<small>C</small></button><button data-go="home" title="All cards">▦</button></nav><div class="overlay" id="overlay"></div><aside class="sidebar" id="sidebar"></aside></div>

['AEB','OFF','⛨','#ff6986','#3b1b2b','aeb'],['ROAMING','ON','◉','#1ad998','#0b2e2c','modem'],['SOC','49.0%','ϟ','#1fe3b2','#073139','energy'],['RANGE','~296 km','▣','#bd71ff','#28214d','energy'],
['ADB','CONNECTED*','🔗','#48c6ff','#0c2a3b','adb'],['WEATHER','20°','☀','#fdbf48','#332a1a','home','Cloudy • 70%'],['AUX 12V','13.7V','⌁','#0bd4bc','#092d36','energy'],['CPU','58.1°C','♟','#ffb949','#363022','service'],
['HEALTH','97%','▣','#24e4a0','#0b3029','energy'],['BATT TEMP','28°C','♨','#ffd05b','#322a22','energy'],['CELL Δ','3mV','♙','#2dd3c5','#0b2f34','energy'],['TRIP TODAY','-- km | -- kWh','▰','#ad69f8','#25183e','trip'],
['MOTOR TEMP','66°C','⚙','#ffbc46','#383021','energy'],['ODOMETER','23571.1 km','◴','#4ec9ff','#092a42','trip'],['NEXT EVENT','Christmas','☾','#b97aff','#251d47','home','In 67 days'],['TODAY','Mon, 19 Oct','▣','#ffb94b','#2a262b','home','Reference date']];

const pages=[['Workspace','home','Home Workspace','⌂'],['Workspace','split','Multi-Split Workspace','▦'],['Power & Consumption','energy','Energy & BMS','ϟ'],['Power & Consumption','trip','Statistics & Trips','▤'],['Vehicle & Service','service','Service & OTA','⚙'],['Vehicle & Service','modem','Modem Hub','◈'],['Vehicle & Service','adb','ADB Engine Hub','⌘'],['Vehicle & Service','whitelist','Whitelisting Manager','⊞'],['Vehicle & Service','aeb','AEB Status','⛨'],['Tools & Connectivity','cloud','Cloud Link','☁'],['Tools & Connectivity','terminal','ADB Terminal','▣'],['Tools & Connectivity','weather','Weather & Air','☼'],['Additional from APK','cameras','Cameras & Vision','◉'],['Additional from APK','windows','Doors & Windows','⌑'],['Additional from APK','climate','Climate','≋'],['Additional from APK','lights','Lighting & Audio','✺'],['Settings','settings','App Settings','☷']];

const history=[['Oct 17 20:06','AUTO','32.7 km','4.40 kWh'],['Oct 17 18:41','AUTO','0.8 km','2.00 kWh'],['Oct 17 01:10','AUTO','23.8 km','3.60 kWh'],['Oct 16 20:01','AUTO','0.8 km','1.20 kWh'],['Oct 16 14:40','AUTO','21.8 km','3.20 kWh'],['Oct 16 12:09','AUTO','0.0 km','1.40 kWh']];

// Persistent DEMO-only preferences. No network calls, ADB bridge, vehicle APIs or permissions.
const demo3={tab:'logs',filter:'all',settingsTab:'startup',modemTab:'local',guardian:'Auto',floating:false,showSystem:false,edit:false,toast:'',trips:[],selected:{},settings:{ac:2.58,dc:7.67,capacity:87.04,currency:'EGP',autoSave:true,startup:'Silent',floatingSize:'SMALL',appearance:'Night',floatingBattery:true,floatingCloud:true,floatingRoaming:false,ambient:false,cleanupInterval:'6',autoRoaming:false}};
try{const saved=JSON.parse(localStorage.getItem('dbc-demo-v3')||'null');if(saved){if(saved.settings)Object.assign(demo3.settings,saved.settings); if(Array.isArray(saved.trips))demo3.trips=saved.trips.slice(-100);}}catch(e){}
const persist3=()=>{try{localStorage.setItem('dbc-demo-v3',JSON.stringify({settings:demo3.settings,trips:demo3.trips}))}catch(e){}};
const label3=(name,sub='')=>`<span>${name}${sub?`<small>${sub}</small>`:''}</span>`;
const action3=(text,id,cl='')=>`<button class="btn3 ${cl}" id="${id}">${text}</button>`;
const switch3=(k,enabled=true)=>`<input class="input3" type="checkbox" data-setting="${k}" ${demo3.settings[k]?'checked':''} ${enabled?'':'disabled'} aria-label="${k}">`;
const row3=(label,other,sub='')=>`<div class="row3">${label3(label,sub)}${other}</div>`;
const sample3='<span class="badge-sample">SAMPLE / NOT LIVE</span>';
const safe3=msg=>`<div class="safe3">⚠ ${msg}</div>`;
function toast3(msg){let prev=document.querySelector('.toast3');if(prev)prev.remove();let el=document.createElement('div');el.className='toast3';el.textContent=msg;document.querySelector('.shell').appendChild(el);setTimeout(()=>el.remove(),2600)}
function trips(){const s=demo3.settings;let rows=[...history.map((r,i)=>({date:r[0],mode:'AUTO • VIDEO',dist:parseFloat(r[2]),energy:parseFloat(r[3]),kind:'sample',age:7+i})),...demo3.trips];let filtr=demo3.filter;let selected=rows.filter(r=>filtr==='all'||(filtr==='today'&&r.age===0)||(filtr==='week'&&r.age<=7)||(filtr==='month'&&r.age<=31));
return `<div class="pagebody"> <div class="tabs3"><button id="tripLogs" class="${demo3.tab==='logs'?'active':''}">LOGS</button><button id="tripSettings" class="${demo3.tab==='settings'?'active':''}">SETTINGS</button></div>${demo3.tab==='settings'?`<div class="panel3"><div class="minihead3" style="color:#e5a33a">PRICING & CONFIGURATION</div>${row3('Home (AC) Rate',`<input class="input3" type="number" min="0" max="10000" step=".01" data-num="ac" value="${s.ac}">`)}${row3('Fast (DC) Rate',`<input class="input3" type="number" min="0" max="10000" step=".01" data-num="dc" value="${s.dc}">`)}${row3('Battery Capacity (kWh)',`<input class="input3" type="number" min="1" max="300" step=".01" data-num="capacity" value="${s.capacity}">`)}${row3('Display Currency',`<select class="input3" data-setting="currency">${['EGP','SAR','AED','KWD','QAR','IQD','USD'].map(v=>`<option value="${v}" ${v===s.currency?'selected':''}>${v}</option>`).join('')}</select>`)}${row3('Automatically Save Manual Trips on Finish',switch3('autoSave'))}<div class="actionbar">${action3('▣ SAVE ALL SETTINGS','saveTrip','blue')}</div></div><div class="panel3">${action3('CLEAR LOCAL DEMO TRIP HISTORY','clearHistory','warning')}</div>${safe3('Rates and saved journeys affect this preview only, not the vehicle.')}`:
`<div class="tripgrid"><div class="panel3 tripstat"><div class="minihead3" style="color:#17c38a">TRIP SENTINEL</div><div class="tripbadge">● ${tripDemo?'DEMO ACTIVE':'SENTRY • DEMO'}</div><p class="smallmuted">CURRENT SESSION</p><div class="bigvalue">0.0 km</div><p class="smallmuted">0.00 kWh • No GPS / BYD data</p>${action3(tripDemo?'■ STOP DEMO TRIP':'▶ START MANUAL DEMO','startTrip','green')}<div style="height:7px"></div>${action3('EXPORT LOCAL HISTORY','exportTrips')}</div><div class="panel3 tablewrap"><div class="minihead3">TRIP PERFORMANCE JOURNAL ${sample3}</div><div class="filter3">${[['all','ALL TRIPS'],['today','TODAY'],['week','THIS WEEK'],['month','THIS MONTH']].map(([v,n])=>`<button data-filter="${v}" class="${demo3.filter===v?'active':''}">${n}</button>`).join('')}</div><table><thead><tr><th>DATE</th><th>MODE</th><th>DISTANCE</th><th>ENERGY</th><th>COST (${s.currency})</th></tr></thead><tbody>${selected.length?selected.map(r=>`<tr><td>${r.date}</td><td class="ok">${r.mode}</td><td>${r.dist.toFixed(1)} km</td><td>${r.energy.toFixed(2)} kWh</td><td>${(r.energy*s.ac).toFixed(2)}</td></tr>`).join(''):'<tr><td colspan="5">No demo journeys for this period.</td></tr>'}</tbody></table><p class="muted3">Historical rows from video are examples. New manual journeys are local only.</p></div></div>`}</div>`}
function settings(){let s=demo3.settings;let radio=(name,key,values)=>`<div class="actionbar">${values.map(v=>`<label style="padding:8px;border:1px solid #2e3e5e;border-radius:8px"><input type="radio" name="${name}" value="${v}" data-radio="${key}" ${s[key]===v?'checked':''}> ${v}</label>`).join('')}</div>`;
return `<div class="pagebody"><div class="banner3"><span>● SETTINGS</span><span>WIDGETS • FLOATING • LANGUAGE • SYSTEM</span>${sample3}</div><div class="panel3"><div class="minihead3" style="color:#ffb94b">⚙ STARTUP & AUTOMATION</div>${row3('Startup mode',radio('startupMode','startup',['Silent','Notification']))}${row3('Auto AEB-off on start','<button class="btn3" disabled>UNAVAILABLE</button>','Vehicle safety function not implemented')}${row3('Auto roaming on start',switch3('autoRoaming'),'Preference saved locally; no modem changes')}${row3('Auto cleanup on boot','<span class="badge-sample">UNAVAILABLE</span>','Requires operating-system integration')}${row3('Ambient light on boot',switch3('ambient'),'Visual preference only')}${row3('Cleanup interval (hrs)',`<select class="input3" data-setting="cleanupInterval">${['1','3','6','12','24'].map(x=>`<option value="${x}" ${s.cleanupInterval===x?'selected':''}>${x}</option>`).join('')}</select>`,'No automatic system cleanup')}</div><div class="panel3"><div class="minihead3">◈ FLOATING STATUS</div>${row3('Battery Health Floating',switch3('floatingBattery'),'Illustrative demo overlay')}${row3('Cloud Status Floating',switch3('floatingCloud'),'Illustrative demo overlay')}${row3('AEB Floating','<span class="badge-sample">READ ONLY</span>','No AEB commands')}${row3('Roaming Floating',switch3('floatingRoaming'),'Illustrative demo overlay')}${row3('Bubble size',`<select class="input3" data-setting="floatingSize">${['SMALL','LARGE'].map(x=>`<option ${s.floatingSize===x?'selected':''}>${x}</option>`).join('')}</select>`)}</div><div class="panel3"><div class="minihead3">🌐 LANGUAGE</div>${row3('Interface',`<select class="input3" id="lang3"><option value="en" ${lang==='en'?'selected':''}>English</option><option value="ar" ${lang==='ar'?'selected':''}>العربية</option></select>`)}<div class="minihead3" style="margin-top:14px">◐ APPEARANCE</div>${row3('Color mode',radio('appMode','appearance',['Night','Day','Auto']))}</div>${safe3('Only display and local preferences are saved; none change BYD system settings.')}</div>`}
function service3(){return `<div class="pagebody"><div class="banner3"><span>⚙ SERVICE & OTA</span><span>MAINTENANCE & PERFORMANCE</span>${sample3}</div><div class="panel3"><div class="minihead3" style="color:#b980f7">MAINTENANCE & PERFORMANCE</div><div class="cols3">${['RAM BOOST','DEEP CLEAN','CLEAN LOGS'].map(x=>`<div class="metric3">${x}<b style="font-size:15px">NOT CONNECTED</b></div>`).join('')}</div><div class="actionbar">${action3('OPTIMIZE NOW • UNAVAILABLE','serviceOptimize','violet')}</div><div class="row3"><span>Auto RAM Boost<small>Local preview only</small></span><span class="badge-sample">NOT AVAILABLE</span></div>${row3('Timed cleanup','<span class="badge-sample">NOT AVAILABLE</span>')}</div><div class="panel3"><div class="minihead3" style="color:#ffc36c">THERMAL GUARD</div>${row3('Auto-cooling guard',`<span class="err3">66°C • SAMPLE</span>`,'Reference value only; no temperature monitoring.')}</div><div class="panel3"><div class="minihead3">OTA & UPDATE</div>${row3('OTA updates',`<span class="badge-sample">OFFLINE DEMO</span>`)}<div class="actionbar">${action3('CHECK VERSION (LOCAL)','otaCheck','blue')}${action3('DOWNLOAD • DISABLED','otaDownload')}</div></div><div class="panel3"><div class="minihead3" style="color:#ffa951">ADB & MAINTENANCE • VISUAL REFERENCE</div>${row3('ADB dashboard',action3('OPEN PREVIEW','adbOpen'))}${row3('Repair & restart recovery','<span class="badge-sample">UNAVAILABLE</span>')}</div>${safe3('No cleanup, reboot, OTA, thermal control or Android privileged commands are executed.')}</div>`}
function modem3(){return `<div class="pagebody"><div class="banner3"><span>◈ MODEM ENGINE HUB</span><span>STATUS: DEMO • NO MODEM ACCESS</span>${sample3}</div><div class="tabs3">${[['local','SIM & eSIM'],['cloud','CLOUD LINK']].map(([v,n])=>`<button class="${demo3.modemTab===v?'active':''}" data-modem="${v}">${n}</button>`).join('')}</div>${demo3.modemTab==='local'?`<div class="modemgrid3"><div class="modemring3"><span>SIMWorld</span><b>2G</b><small>ROAMING • SAMPLE</small></div><div class="panel3"> <div class="minihead3" style="color:#ffd05e">SIM IDENTITY</div>${row3('ICCID','HIDDEN')}${row3('IMSI','HIDDEN')}${row3('SHIZUKU SOURCE','<span class="err3">OFFLINE</span>')}${row3('SIGNAL STRENGTH','–95 dBm • SAMPLE')}</div><div class="panel3"><div class="actionbar" style="display:grid">${action3('REFRESH','refreshModem')}${action3('eSIM INFO','esimInfo')}${action3('APN • VIEW','apnInfo')}${action3('AIRPLANE • N/A','airplaneDemo')}</div></div></div><div class="actionbar" style="justify-content:center">${action3('2G • SAMPLE','modem2g','blue')}${action3('3G • SAMPLE','modem3g')}</div><div class="panel3"><div class="minihead3">DETECTED eSIM PROFILES • EXAMPLES FROM VIDEO</div>${['Local 00101','HK Roaming','Etisalat'].map((n,i)=>row3('● '+n,`<span class="muted3">Sample profile ${i+1}</span>`,'Not installed by this preview')).join('')}</div>`:cloud3()}${safe3('SIM IDs from the video are intentionally omitted. No eSIM or APN changes are possible.')}</div>`}
function cloud3(){return `<div class="panel3"><div class="minihead3">MQTT STATUS • CLOUD LINK</div>${row3('Cloud client','<span class="badge-sample">DISCONNECTED</span>')}${row3('Cloud power','OFFLINE')}${row3('Link status','NOT CONFIGURED')}${row3('SIM state','READ-ONLY SAMPLE')}<div class="actionbar">${action3('REFRESH DISPLAY','refreshCloud')}${action3('ACTIVATE CLOUD • N/A','activateCloud','green')}</div><div class="safe3">NO external connections; sample progress below illustrates the original Cloud Link stages.</div><div class="row3">${label3('CLOUD LINK','Step 2/6 • waiting for a configured service')}<b class="color3">STEP 2/6</b></div><div class="progress3"><i style="width:33%"></i></div>${row3('Cloud Wi-Fi mode','OFF • DEMO')}${row3('Keep Wi-Fi on when off','OFF • DEMO')}</div>`}
function adb3(){return `<div class="pagebody"><div class="banner3"><span>⌘ ADB ENGINE HUB</span><span>NO ROOT • NO ADB</span>${sample3}</div><div class="panel3" style="text-align:center;padding:30px"><div style="font-size:46px;color:#2cf0a2">⛨</div><div style="font-size:19px;color:#35df9f;margin:12px 0">DEMO • NOT PROTECTED</div><div class="muted3">Original screen shows PROTECTED on connected hardware</div></div><div class="panel3">${row3('HEAD UNIT','Not detected','Reference screenshot shows a manufacturer build number')}</div><div class="panel3"><div class="minihead3">GUARDIAN MODE • VISUAL SELECTION ONLY</div><div class="cols3">${['Auto','Always On','Legacy'].map(v=>`<button data-guardian="${v}" class="btn3 ${demo3.guardian===v?'blue':''}">${v}</button>`).join('')}</div><p class="smallmuted">Selected: ${demo3.guardian} (interface only)</p></div><div class="panel3">${row3('ADB port 5555','<span class="badge-sample">NOT CONNECTED</span>')}${row3('Auto-recovery engine','STANDBY • DEMO')}${row3('Guardian background service','NOT RUNNING')}${row3('Wi-Fi / hotspot presenter','UNAVAILABLE')}</div><div class="actionbar">${action3('OPEN TERMINAL PREVIEW','openTerminal')}</div>${safe3('No ADB port, guardian service, privileged shell, or OS recovery is activated.')}</div>`}
function terminal3(){return `<div class="pagebody"><div class="banner3"><span>▣ ADB TERMINAL</span><span>ISOLATED • READ-ONLY</span></div><div class="cols2"><div class="panel3"><div class="minihead3">ADB TERMINAL</div><div class="terminal3">&gt; Welcome to the terminal preview.\n&gt; No command interpreter is present.\n&gt; Android and BYD system commands are disabled.</div><div class="actionbar">${action3('EXECUTION DISABLED','terminalNope')}</div></div><div class="panel3"><div class="minihead3">SERVICE</div>${row3('Service','NOT RUNNING')}${row3('Connection','OFFLINE')}${row3('Permissions','NONE')}${row3('Log buffer','EMPTY')}<div class="minihead3" style="margin-top:15px">MASTER HOTSPOT</div>${row3('State','UNAVAILABLE')}<div class="minihead3">SYSTEM</div>${action3('REBOOT DISABLED','rebootNope','warning')}</div></div>${safe3('This is not a functional terminal. It cannot run commands or modify Android or vehicle settings.')}</div>`}
function whitelist3(){return `<div class="pagebody"><div class="banner3"><span>● WHITELIST • GRANT HUB</span><span>0 REAL APPS</span>${sample3}</div><div class="panel3"><div class="minihead3" style="color:#f8c46e">ⓘ WHAT EACH BUTTON DOES</div>In the original app this page lists installed applications and grant/backup tools. This preview has no installed-app or permission access.</div><div class="panel3"><input class="input3" style="max-width:none;width:100%" id="appSearch" placeholder="Search demo apps..." value="${demo3.search||''}"><div class="cols2" style="margin:12px 0">${action3('SELECT DEMO ALL','selectApps','violet')}${action3('BACKUP DEMO SELECTION','backupApps')}</div>${row3('Show system apps','<span class="badge-sample">NOT AVAILABLE</span>','No installed application inventory')}${['Example Media','Example Navigation','Example Utility'].filter(x=>x.toLowerCase().includes((demo3.search||'').toLowerCase())).map((x,i)=>row3(x,`<input type="checkbox" data-app="${x}" ${demo3.selected[x]?'checked':''}>`,'Sample only — not a real installed application')).join('')}</div>${safe3('This screen never grants system permissions or changes Android background policy.')}</div>`}
function split3(){return `<div class="pagebody"><div class="banner3"><span>▦ MULTI-SPLIT WORKSPACE</span><span>VISUAL LAYOUT PREVIEW</span></div><div class="twowork3"><div class="splitpane3"><div class="minihead3">LEFT PANEL • ENERGY</div><div class="metric3">SOC (example)<b style="color:#31d8ae">49%</b></div><p class="muted3">Reference value only</p></div><div class="splitpane3"><div class="minihead3">RIGHT PANEL • TRIPS</div><div class="metric3">CURRENT TRIP<b>0.0 km</b></div><p class="muted3">No real vehicle data</p></div></div><div class="actionbar">${action3('VIEW ENERGY','goEnergy','blue')}${action3('VIEW TRIPS','goTrips')}</div>${safe3('This simulates two dashboard panels inside the demo; it does not launch Android split-screen.')}</div>`}
function extra3(){const variants={aeb:['AEB STATUS','Automatic emergency braking','Status view from video','Vehicle safety control is intentionally not implemented.'],weather:['WEATHER & AIR','Weather & Air quality','Weather values in home card','No current weather API connected.'],cameras:['CAMERAS & VISION','AVM / Blind spot','Component names detected in APK','Camera feeds not connected; blind-spot safety tools disabled.'],windows:['DOORS & WINDOWS','Windows & locks','Component names detected in APK','Vehicle window and door actuators not connected.'],climate:['CLIMATE','AC & ventilation','Methods indicated by APK class index','Controls unavailable without approved BYD interface.'],lights:['LIGHTING & AUDIO','Ambient lights & audio','Components indicated by APK','Audio and lighting control disabled.']};let d=variants[page]||['UNVERIFIED','Unknown function','APK evidence only','Not implemented'];return `<div class="pagebody"><div class="banner3"><span>${d[0]}</span><span>UNVERIFIED SCREEN LAYOUT</span></div><div class="panel3"><div class="minihead3">${d[1]}</div><div class="cols3">${['Connection','Observed screen','Control'].map((x,i)=>`<div class="metric3">${x}<b style="font-size:13px">${i===0?'OFFLINE':i===1?'UNKNOWN':'DISABLED'}</b></div>`).join('')}</div><p class="muted3" style="margin-top:12px">Evidence: ${d[2]}</p></div>${safe3(d[3])}</div>`}
function generic(){return page==='service'?service3():page==='modem'?modem3():page==='cloud'?`<div class="pagebody"><div class="banner3">CLOUD LINK • OFFLINE DEMO</div>${cloud3()}</div>`:page==='adb'?adb3():page==='terminal'?terminal3():page==='whitelist'?whitelist3():page==='split'?split3():extra3()}
function render(){let t=pages.find(x=>x[1]===page)?.[2]||(page==='aeb'?'AEB Status':'Home Workspace');$('ptitle').textContent=text(t);$('main').innerHTML=page==='home'?home():page==='energy'?energy():page==='trip'?trips():page==='settings'?settings():generic();renderMenu();$('main').scrollTop=0;syncFloat3()}
function setpage(v){page=v;navOpen=false;render()}

let reorderPick3=null;
function syncFloat3(){let b=$('floatingDemo');if(b)b.remove();if(page==='home'&&demo3.settings.floatingBattery){let e=document.createElement('div');e.id='floatingDemo';e.className='floating3';e.innerHTML='<div>HEALTH <b>97%</b></div><div>CLOUD <b class="off">OFF</b></div><div>AEB <b class="off">N/A</b></div><div>ROAM <b class="off">N/A</b></div>';document.querySelector('.shell').append(e)}}
// Capture card-edit clicks before the simple V2 navigation handler.
document.addEventListener('click',e=>{let ed=e.target.closest('#edit');if(ed){e.preventDefault();e.stopImmediatePropagation();demo3.edit=!demo3.edit;reorderPick3=null;render();return}let card=e.target.closest('[data-order]');if(card){e.preventDefault();e.stopImmediatePropagation();let i=Number(card.dataset.order);if(reorderPick3===null){reorderPick3=i;toast3('Choose second card to swap')}else if(reorderPick3!==i){[cards[reorderPick3],cards[i]]=[cards[i],cards[reorderPick3]];reorderPick3=null;render()}else reorderPick3=null;return}},true);
function saveData3(filename,content){let file=new Blob([content],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(file);let a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
document.addEventListener('click',e=>{
const filter=e.target.closest('[data-filter]');if(filter){demo3.filter=filter.dataset.filter;render();return}
const mod=e.target.closest('[data-modem]');if(mod){demo3.modemTab=mod.dataset.modem;render();return}
const guard=e.target.closest('[data-guardian]');if(guard){demo3.guardian=guard.dataset.guardian;toast3('Visual choice only; Android guardian unchanged');render();return}
const id=e.target.closest('button')?.id||'';
if(id==='tripLogs'){demo3.tab='logs';render()}else if(id==='tripSettings'){demo3.tab='settings';render()}
else if(id==='saveTrip'){persist3();toast3('Local demo settings saved')}
else if(id==='clearHistory'){if(confirm('Delete locally created demo trips?')){demo3.trips=[];persist3();render()}}
else if(id==='exportTrips'){saveData3('dbc-demo-trips.csv','date,mode,distance_km,energy_kwh\n'+demo3.trips.map(r=>[r.date,r.mode,r.dist,r.energy].join(',')).join('\n'));toast3('Exported local demo journeys')}
else if(id==='selectApps'){for(let v of ['Example Media','Example Navigation','Example Utility'])demo3.selected[v]=true;render()}
else if(id==='backupApps'){saveData3('demo-application-selection.txt',Object.keys(demo3.selected).filter(x=>demo3.selected[x]).join('\n'));toast3('Saved sample list, no real apps')}
else if(id==='goEnergy'){setpage('energy')}else if(id==='goTrips'){setpage('trip')}else if(id==='adbOpen'){setpage('adb')}else if(id==='openTerminal'){setpage('terminal')}
else if(['otaCheck','refreshModem','esimInfo','apnInfo','airplaneDemo','serviceOptimize','activateCloud','refreshCloud','modem2g','modem3g','otaDownload','terminalNope','rebootNope'].includes(id)){toast3('Preview only — no system or car command executed')}
});
document.addEventListener('change',e=>{
const el=e.target;if(el.id==='lang3'){lang=el.value;render();return}
if(el.dataset.setting){demo3.settings[el.dataset.setting]=el.type==='checkbox'?el.checked:el.value;persist3();render();return}
if(el.dataset.num){let v=Number(el.value);if(!Number.isFinite(v)||v<0||v>10000){toast3('Invalid number');return}demo3.settings[el.dataset.num]=v;persist3();return}
if(el.dataset.radio){demo3.settings[el.dataset.radio]=el.value;persist3();render();return}
if(el.dataset.app){demo3.selected[el.dataset.app]=el.checked;return}
});
document.addEventListener('input',e=>{if(e.target.id==='appSearch'){demo3.search=e.target.value;let pos=e.target.selectionStart;render();let el=$('appSearch');if(el){el.focus();el.setSelectionRange(pos,pos)}}});
// React to start/end manual demo with a local synthetic record; NEVER claim a real route.
document.addEventListener('click',e=>{if(e.target.id==='startTrip'&&tripDemo===false){demo3.trips.push({date:new Date().toISOString().slice(0,16).replace('T',' '),mode:'MANUAL • DEMO',dist:0,energy:0,age:0});persist3()}},true);

document.addEventListener('click',e=>{const el=e.target.closest('[data-go]');if(el){setpage(el.dataset.go);return}if(e.target.closest('#hamb')){navOpen=!navOpen;renderMenu();return}if(e.target.closest('#overlay')){navOpen=false;renderMenu();return}if(e.target.closest('#toggleLang')){lang=lang==='ar'?'en':'ar';render();return}if(e.target.closest('#edit')){alert('Visual demonstration only. Editing is not available.');return}if(e.target.closest('#startTrip')){tripDemo=!tripDemo;render();return}if(e.target.closest('#clearTrips')){tripDemo=false;render();return}});render();
</script></body></html>
