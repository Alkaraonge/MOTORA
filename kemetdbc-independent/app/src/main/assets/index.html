<script>
'use strict';
const MENU=[['workspace','Home Workspace','⌂','GENERAL'],['split','Multi-Split Workspace','▣','GENERAL'],['energy','Energy & BMS','ϟ','POWER & CONSUMPTION'],['trips','Statistics & Trips','◷','POWER & CONSUMPTION'],['service','Service & OTA','⚙','VEHICLE CONTROL'],['modem','Modem Hub','☷','VEHICLE CONTROL'],['adb','ADB Engine Hub','◈','VEHICLE CONTROL'],['whitelist','Whitelist Manager','☑','VEHICLE CONTROL'],['settings','App Settings','⚙','TOOLS & CONNECTIVITY'],['aeb','AEB & Safety','⛨','TOOLS & CONNECTIVITY'],['windows','Doors & Windows','▥','TOOLS & CONNECTIVITY'],['climate','Climate Controls','☀','TOOLS & CONNECTIVITY'],['cameras','Cameras & Vision','◎','TOOLS & CONNECTIVITY'],['blindspot','Blind Spot Monitor','◉','TOOLS & CONNECTIVITY'],['lighting','Lights & Audio','✦','TOOLS & CONNECTIVITY'],['network','Wi-Fi & Cloud','⌁','TOOLS & CONNECTIVITY'],['maintenance','Diagnostics & Health','♡','TOOLS & CONNECTIVITY'],['floating','Floating Status','◈','OTHER FEATURES'],['weather','Weather & Clock','☀','OTHER FEATURES'],['automation','Event Automation','⌁','OTHER FEATURES'],['terminal','ADB Terminal','>_','OTHER FEATURES'],['license','Activation & License','⌑','OTHER FEATURES'],['support','Help & Support','?','OTHER FEATURES']];
const AR={workspace:'الواجهة الرئيسية',split:'تقسيم الشاشة',energy:'البطارية والطاقة',trips:'الإحصائيات والرحلات',service:'الصيانة والتحديث',modem:'مودم السيارة',adb:'مدير ADB',whitelist:'قائمة التطبيقات المسموحة',settings:'إعدادات التطبيق',aeb:'الكبح الطارئ والسلامة',windows:'الأبواب والنوافذ',climate:'التكييف',cameras:'الكاميرات والرؤية',blindspot:'النقطة العمياء',lighting:'الإضاءة والصوت',network:'الشبكات والسحابة',maintenance:'التشخيص وحالة النظام',floating:'المؤشر العائم',weather:'الطقس والوقت',automation:'أتمتة الأحداث',terminal:'طرفية ADB',license:'الترخيص والتفعيل',support:'المساعدة والدعم'};
const DEF={page:'workspace',language:'en',mode:'demo',scale:1,theme:'midnight',settings:{floating:true,autostart:false,autoAeb:false,roaming:false,notify:true,autosave:true},trips:[],currentTrip:null,selectedTab:'logs',filter:'all',createdAt:Date.now()};
function load(){try{const s=JSON.parse(localStorage.getItem('dbc_independent_v1'));return {...DEF,...s,settings:{...DEF.settings,...s.settings},trips:Array.isArray(s.trips)?s.trips:[]}}catch(e){return structuredClone(DEF)}}
let st=load();let toastTimer=0;const $=id=>document.getElementById(id);const t=(en,ar)=>st.language==='ar'?ar:en;const safe=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('dbc_independent_v1',JSON.stringify(st))}catch(e){}};
function notify(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3600)}
function trLabel(id){let found=MENU.find(x=>x[0]===id);return st.language==='ar'?AR[id]:found?.[1]||id}
function modeMark(){return st.mode==='demo'?t('SIMULATED VALUES — NO VEHICLE CONNECTION','قيم افتراضية — لا يوجد اتصال بالسيارة'):t('NO DATA — VEHICLE DISCONNECTED','لا توجد بيانات — السيارة غير متصلة')}
function val(x,unit=''){return st.mode==='demo'?x+unit:'—'}
function section(title,color='var(--cyan)'){return `<div class="sectionhead" style="color:${color}"><span class="dot"></span>${title}</div>`}
function card(inner,extra=''){return `<section class="card" ${extra}>${inner}</section>`}
function btn(label,fn,clazz=''){return `<button class="btn ${clazz}" data-action="${fn}">${label}</button>`}
function info(msg){return `<div class="banner">${msg}</div>`}
function alertBox(msg){return `<div class="alert">⚠ ${msg}</div>`}
function header(sub=''){return `<div class="headline"><div><h2>${trLabel(st.page)}</h2><div class="sub">${sub||modeMark()}</div></div><span class="pill ${st.mode==='demo'?'demo':'off'}">${st.mode==='demo'?'● DEMO':'◌ OFFLINE'}</span></div>`}
function tile(name,v,icon,color='cyan',meta=''){let colors={cyan:['#31c8ff','#124ee0'],green:['#2ddaa8','#157855'],red:['#f55b88','#e2356f'],orange:['#f7ae37','#ae6716'],purple:['#be7aff','#7931e4']};let c=colors[color]||colors.cyan;return `<div class="tile" style="--hue:${c[0]};--glow:${c[1]}"><span class="emblem">${icon}</span><div class="big">${val(v)}</div><div class="name">${name}</div>${meta?`<div class="meta">${meta}</div>`:''}</div>`}
function workspace(){let d=[['AEB','OFF','⛨','red'],['ROAMING','ON','♧','green'],['SOC','49.0%','ϟ','green'],['RANGE','~296 km','◈','purple'],['ADB','CONNECTED','⌘','cyan'],['WEATHER','20°','☀','orange'],['AUX 12V','13.7V','◉','green'],['CPU','58.1°C','♟','orange'],['HEALTH','97%','▣','green'],['BATT TEMP','28°C','♨','orange'],['CELL Δ','3mV','◉','green'],['TRIP TODAY','-- km | -- kWh','▥','purple'],['MOTOR TEMP','66°C','⚙','orange'],['ODOMETER','23571.1 km','◷','cyan'],['NEXT EVENT','Christmas','☾','purple'],['TODAY','Mon, 19 Oct','▣','orange']];return header(t('Reference layout: sixteen tiles, 4 columns. Values are illustrative.','تخطيط مرجعي: 16 بطاقة بأربعة أعمدة. القيم توضيحية.'))+`<div class="headline"><div><b>${t('Welcome back','مرحباً بعودتك')}</b><div class="sub">${t('Mon, 19 Oct — demonstration','الاثنين 19 أكتوبر — عرض تجريبي')}</div></div><div class="actionrow">${btn('EN / عربي','lang')}${btn(t('EDIT','تعديل'),'edit')}${btn(t('LIVE STATUS','الحالة'),'mode')}</div></div><div class="homegrid">${d.map(x=>tile(...x)).join('')}</div><div class="footerNote">${t('Vehicle control and OEM functions intentionally disabled.','التحكم الحقيقي بأنظمة السيارة معطل.')}</div>`}
function stat(name,v,sub,color='good'){return `<div class="panel"><div class="eyebrow">${name}</div><div class="fieldrow"><strong class="${color}">${val(v)}</strong><small>${sub}</small></div><div class="minibar"></div></div>`}
function energy(){return header(t('Energy • BYD • LIVE (simulation only)','الطاقة • BYD • القيم محاكاة فقط'))+card(`${section('ENERGY & BMS')}<div class="energyMain"><div class="donut"><div class="donutInner"><strong>${val('49%')}</strong><small>READY</small></div></div><div class="energyText"><div class="eyebrow">${t('Vehicle ready. Battery at 49%.','السيارة جاهزة. البطارية عند 49% — افتراضي')}</div><div class="bar"></div><div class="grid2"><div class="panel"><small>CAR SAYS</small><div class="metric" style="font-size:19px">${val('296 km')}</div></div><div class="panel"><small>YOU’LL GET</small><div class="metric" style="font-size:19px;color:var(--cyan)">${val('223 km')}</div></div></div></div></div><div class="fieldrow"><strong class="good">${val('0.0 kW')}</strong><small>Idle • ${modeMark()}</small></div>`) + `<div class="grid2" style="margin-top:9px">${stat('BATTERY HEALTH','97%','Excellent')}${stat('BATTERY CELLS','3 mV','Balanced')}${stat('BATTERY TEMPERATURE','28°C','Just right')}${stat('MOTOR','66°C','Running cool')}</div>${info(t('Source of all readings: demonstration data. Data from a real vehicle requires a verified, authorised read-only interface.','مصدر القراءات: بيانات افتراضية. تتطلب بيانات السيارة الحقيقية واجهة قراءة موثّقة ومصرّحاً بها.'))}`}
function tripFilter(){return `<div class="actionrow">${[['all','ALL TRIPS'],['today','TODAY'],['week','THIS WEEK'],['month','THIS MONTH']].map(([id,l])=>`<button class="btn tiny ${st.filter===id?'purple':''}" data-filter="${id}">${t(l,{all:'كل الرحلات',today:'اليوم',week:'هذا الأسبوع',month:'هذا الشهر'}[id])}</button>`).join('')}</div>`}
function formatDate(x){return new Date(x).toLocaleString(st.language==='ar'?'ar-IQ':'en-GB',{dateStyle:'medium',timeStyle:'short'})}
function trips(){let n=Date.now();let arr=st.trips.filter(r=>st.filter==='all'||(n-r.start<(st.filter==='today'?86400000:st.filter==='week'?604800000:2592000000)));let running=!!st.currentTrip;return header(t('Trip Sentinel • local demo journal','مسجل رحلات تجريبي محلي'))+`<div class="tabbar"><button class="tab ${st.selectedTab==='logs'?'active':''}" data-tab="logs">${t('LOGS','السجل')}</button><button class="tab ${st.selectedTab==='settings'?'active':''}" data-tab="settings">${t('SETTINGS','الإعدادات')}</button></div>`+(st.selectedTab==='settings'?card(section('TRIP SETTINGS')+`<p class="note">${t('Demo trips are saved locally. Automatic trip detection is unavailable without verified vehicle telemetry.','تُحفظ الرحلات التجريبية محلياً. التعرّف التلقائي على الرحلات غير متاح دون بيانات سيارة موثوقة.')}</p><label>${t('Cost per kWh (optional)','سعر الكيلوواط/ساعة (اختياري)')} <input id="tariff" inputmode="decimal" placeholder="0.00" value="${safe(st.tariff||'')}"></label> ${btn(t('SAVE','حفظ'),'saveTariff','primary')}`):`<div class="twoCol"><section class="card">${section('TRIP SENTINEL','var(--green)')}<div class="pill" style="color:var(--green)">${running?'● RECORDING DEMO TRIP':'● SENTINEL READY'}</div><div class="eyebrow" style="margin-top:15px">CURRENT SESSION</div><div class="metric">${running?'●':'0.0'} km</div><div class="muted">${running?t('Recording duration from device time','يجري تسجيل مدة الرحلة فقط'):val('0.00 kWh')}</div><div style="height:22px"></div>${btn(running?t('■ STOP DEMO TRIP','■ إيقاف الرحلة'):t('▶ START MANUAL TRIP','▶ بدء رحلة تجريبية'),running?'endTrip':'startTrip','primary full')}<div style="height:8px"></div>${btn(t('CLEAR DEMO LOGS','مسح الرحلات'),'clearTrips','full')}</section><section class="card">${section('TRIP PERFORMANCE JOURNAL')}${tripFilter()}<div class="tablewrap"><table><thead><tr><th>${t('DATE','التاريخ')}</th><th>${t('MODE','النوع')}</th><th>${t('DISTANCE','المسافة')}</th><th>${t('DURATION','المدة')}</th><th>${t('ENERGY','الطاقة')}</th></tr></thead><tbody>${arr.length?arr.map(r=>`<tr><td>${formatDate(r.start)}</td><td class="good">DEMO</td><td>${r.distance||'—'} km</td><td>${Math.round((r.end-r.start)/60000)} min</td><td>—</td></tr>`).join(''):`<tr><td colspan="5" class="empty">${t('No recorded demo trips','ماكو رحلات تجريبية محفوظة')}</td></tr>`}</tbody></table></div><div class="horizontal" style="margin-top:10px">${btn(t('EXPORT CSV','تصدير CSV'),'exportTrips')}${btn(t('ADD SAMPLE TRIP','إضافة رحلة نموذجية'),'addTrip')}</div></section></div>`)+info(t('Manual trip demo stores time. Distance and energy are not inferred or invented as real measurements.','الرحلة التجريبية تسجل الوقت فقط؛ المسافة والطاقة لا تُعرض كقراءات حقيقية.'))}
function service(){return header()+card(section('SERVICE OPTIMISATION','var(--purple)')+`<div class="threeCol">${['RAM BOOST','DEEP CLEAN','CLEAN LOGS'].map(s=>`<div class="panel" style="text-align:center"><b style="color:var(--purple)">${s}</b><div class="sub">${t('Display only','للعرض فقط')}</div></div>`).join('')}</div><div style="margin-top:10px">${btn(t('OPTIMIZE NOW (PREVIEW)','معاينة التحسين'),'previewOptimize','purple full')}</div><div class="spaced" style="margin-top:12px">${sw('Auto RAM Boost','autoboost','Preview preference; no system changes')}${sw('Timed Cleanup','timed','Does not modify car software')}</div>`)+`<div style="height:10px"></div>`+card(section('THERMAL GUARD','var(--orange)')+`<div class="fieldrow"><span>Auto-cooling guard</span><strong class="good">${val('60.8°C')}</strong></div>${sw('Thermal monitoring display','thermal','No manufacturer fan or CPU controls')}`)+`<div style="height:10px"></div>`+card(section('OTA & UPDATE')+`<p class="note">${t('Car OTA updates are never executed by this demo.','لن تُنفّذ هذه النسخة تحديثات لأنظمة السيارة.')}</p>${btn('CHECK LOCAL DEMO STATUS','otaCheck')}`)}
function sw(label,key,desc){let checked=st.settings[key];return `<label class="switch"><span><strong>${label}</strong><small>${desc}</small></span><input type="checkbox" data-setting="${key}" ${checked?'checked':''}></label>`}
function modem(){return header()+card(section('MODEM HUB')+`<div class="grid2"><div class="panel"><small>DATA CONNECTION</small><div class="metric" style="font-size:24px">${st.mode==='demo'?'4G / LTE':'OFFLINE'}</div><span class="good">${t('Demo only','تجريبي فقط')}</span></div><div class="panel"><small>SIM / eSIM</small><div class="metric" style="font-size:21px">${st.mode==='demo'?'SIM 1':'NO DATA'}</div><small>${t('No real SIM identifiers','لا تُقرأ معرّفات شريحة حقيقية')}</small></div></div><div style="margin-top:10px" class="actionrow">${btn(t('REFRESH PREVIEW','تحديث العرض'),'refresh')}${btn('eSIM PROFILE','esim')}${btn('APN PROFILES','apn')}</div>`)+`<div style="height:10px"></div>`+card(section('NETWORK STATUS')+['Mobile network','SIM state','Wi-Fi','Signal strength','Cell roaming','Cloud connection'].map((x,i)=>`<div class="fieldrow"><label>${x}</label><strong class="${i===5?'warn':'cyan'}">${val(['Connected (demo)','Ready (demo)','Available (demo)','-78 dBm','ON (demo)','Not connected'][i])}</strong></div>`).join(''))}
function adb(){return header()+alertBox(t('ADB/system operations are not available. No shell commands or privileged actions run on your car.','عمليات ADB والنظام غير متاحة. لا تُرسل أي أوامر إلى وحدة السيارة.'))+card(section('ADB ENGINE HUB')+`<div class="grid2">${stat('ENGINE STATUS','PROTECTED','No active connection')}${stat('HEAD UNIT','DiLink','Unverified version')}</div><div class="fieldrow"><label>Guardian Mode</label><select id="guardian"><option>Auto (UI only)</option><option>Always On (UI only)</option><option>Legacy (UI only)</option></select></div><div class="fieldrow"><label>Port Status</label><strong class="warn">DISABLED</strong></div>${btn(t('RECHECK STATUS','إعادة فحص الحالة'),'refresh')}`)}
function settings(){return header()+card(section('SETTINGS • DEVICE PREFERENCES','var(--purple)')+`<div class="twoCol"><div class="panel"><h3>STARTUP & AUTOMATION</h3><p class="eyebrow">Startup mode (only this demo)</p><div class="horizontal"><label><input type="radio" name="startup" value="silent" checked> Silent</label><label><input type="radio" name="startup" value="notice"> Notification</label></div>${sw('Auto start preference','autostart','Does not start privileged services')}${sw('Notifications','notify','Local interface preference')}${sw('Remember settings','autosave','Local storage')}</div><div class="panel"><h3>FLOATING STATUS</h3>${sw('Enable demo widget preference','floating','Display preference only')}<div class="fieldrow"><label>Language</label><select id="langpick"><option value="en" ${st.language==='en'?'selected':''}>English</option><option value="ar" ${st.language==='ar'?'selected':''}>العربية</option></select></div><div class="fieldrow"><label>UI Scale</label><select id="scalepick"><option value="0.9">90%</option><option value="1" ${st.scale===1?'selected':''}>100%</option><option value="1.12" ${st.scale===1.12?'selected':''}>112%</option></select></div></div></div>`)+`<div style="height:10px"></div>`+card(section('INTERFACE THEME')+`<div class="actionrow">${['midnight','ocean','violet','amber'].map(x=>`<button class="btn ${st.theme===x?'purple':''}" data-theme="${x}">${x.toUpperCase()}</button>`).join('')}</div><p class="note">${t('Theme and language are saved across application restarts.','ينحفظ اللون واللغة عند إغلاق التطبيق وإعادة تشغيله.')}</p>`)}
function genericPage(id){const labels={split:'Multi-Split Workspace',whitelist:'Whitelist Manager',aeb:'Emergency Braking System (AEB)',windows:'Door & Window Controller',climate:'Climate / Fan Settings',cameras:'Cameras & Vision',blindspot:'Blind Spot Sentinel',lighting:'Ambient Lights & Audio',network:'Connectivity & Parked Cloud',maintenance:'Health & Diagnostics',floating:'Floating Monitor',weather:'Weather & Time',automation:'Event Automation',terminal:'ADB Terminal',license:'License & Activation',support:'Support / Diagnostics'};const data={split:['DUAL VIEW','Dashboard on one side and Energy on the other','Preview can show app pages, not factory display'],whitelist:['APPLICATION ACCESS','Whitelist manager is shown in original navigation','No privileged app management'],aeb:['SAFETY STATUS','AEB: not connected','Emergency braking will not be changed'],windows:['WINDOWS & DOORS','4 window indicators; state unavailable','No open/close commands are sent'],climate:['CLIMATE','Temperature and fan status unavailable','No heating or fan controls are executed'],cameras:['CAMERAS','No vehicle camera connection','No media streams are accessed'],blindspot:['BLIND SPOT','No sensor readings','Do not use for driving assistance'],lighting:['LIGHTS & AUDIO','Not connected to car lighting/audio','No vehicle commands'],network:['CONNECTION HUB','Local demonstration only','No real eSIM or cloud management'],maintenance:['VEHICLE HEALTH','Battery / temperatures / DTC need authorised read access','No diagnostic trouble codes are invented'],floating:['FLOATING STATUS','No system overlay permission requested','Floating UI remains within app'],weather:['LOCAL WEATHER','Weather network API disabled offline','No location permissions required'],automation:['EVENT RULES','Demonstration only','No rules modify car settings'],terminal:['TERMINAL DISABLED','No commands accepted','Safety: unrestricted shell not available'],license:['LOCAL APP','Independent demo without original product license','Does not copy or bypass Kemet licensing'],support:['DIAGNOSTICS','Build: 1.1.0; independent recreation','Original Kemet support is separate']};let [head,detail,note]=data[id];let extra=id==='split'?`<div class="grid2"><div class="panel"><b>Workspace</b><div class="miniBar"></div><p>${val('SOC 49% • RANGE 296 km')}</p></div><div class="panel"><b>Energy & BMS</b><div class="miniBar"></div><p>${val('97% SOH • 28°C')}</p></div></div>`:id==='aeb'?`<div class="fieldrow"><label>Emergency brake assist</label><span class="pill off">STATUS UNKNOWN</span></div><div class="fieldrow"><label>Factory system configuration</label><strong class="warn">READ ONLY</strong></div>`:id==='support'?`<div class="horizontal">${btn(t('COPY LOCAL DIAGNOSTICS','نسخ معلومات التشخيص'),'diagnostics')}</div>`:id==='license'?`<div class="fieldrow"><label>Project</label><strong>DBC INDEPENDENT</strong></div><div class="fieldrow"><label>Source</label><strong>Original implementation</strong></div>`:'';return header()+alertBox(t('This page was identified in APK analysis and/or the four videos. Its complete original behaviour is not verified.','تم تحديد وجود هذا القسم من الـAPK أو الفيديوهات، لكن سلوكه الأصلي الكامل غير مثبت.'))+card(section(head)+`<div class="fieldrow"><strong class="cyan">${detail}</strong><span class="pill off">OFFLINE / PREVIEW</span></div>${extra}<div class="note" style="margin-top:10px">${note}</div>`)}
function sidebar(){let last='';return `<div class="sidehead"><strong>KEMET-STYLE DBC</strong><small>Independent interface study • 1.1.0<br>Offline simulation — not KEMET original</small></div>${MENU.map(([id,label,icon,group])=>{let h='';if(group!==last){h=`<div class="sidegroup">${group}</div>`;last=group}return h+`<button class="sidebtn ${st.page===id?'active':''}" data-page="${id}">${icon} &nbsp; ${trLabel(id)}</button>`}).join('')}<div class="sidefoot">${t('Reconstruction based on 4 videos and the supplied APK. Unseen functions remain unverified. No live commands.','إعادة بناء تعتمد على 4 فيديوهات والـAPK المرفق. الوظائف غير المرئية تحتاج تحقق. لا تحكم حقيقي بالسيارة.')}</div>`}
function render(){if(!MENU.some(x=>x[0]===st.page))st.page='workspace';document.documentElement.lang=st.language;document.documentElement.dir=st.language==='ar'?'rtl':'ltr';document.body.dir=document.documentElement.dir;document.documentElement.style.setProperty('--zoom',st.scale||1);let themes={midnight:['#060916','#38bffc','#9056fa'],ocean:['#03161b','#57d8ff','#1987d1'],violet:['#10091f','#be85ff','#6b56ff'],amber:['#18120a','#ffcc62','#d77b30']};let col=themes[st.theme]||themes.midnight;document.documentElement.style.setProperty('--bg',col[0]);document.documentElement.style.setProperty('--cyan',col[1]);document.documentElement.style.setProperty('--purple',col[2]);$('title').textContent=trLabel(st.page);$('modeTag').textContent=st.mode==='demo'?t('● DEMO / NO VEHICLE','● تجربة / بدون سيارة'):t('● DISCONNECTED','● غير متصل');$('connected').textContent=t('CAR: DISCONNECTED','السيارة: غير متصلة');$('sidebar').innerHTML=sidebar();$('screen').innerHTML=st.page==='workspace'?workspace():st.page==='energy'?energy():st.page==='trips'?trips():st.page==='settings'?settings():st.page==='service'?service():st.page==='modem'?modem():st.page==='adb'?adb():genericPage(st.page);save()}
function menu(close){let open=close===undefined?!$('sidebar').classList.contains('open'):!close;$('sidebar').classList.toggle('open',open);$('shade').classList.toggle('show',open)}
function csv(){let lines=[['ID','Start','End','Duration_min','Distance_km','Energy_kWh'],...st.trips.map(r=>[r.id,new Date(r.start).toISOString(),new Date(r.end).toISOString(),Math.round((r.end-r.start)/60000),r.distance||'', ''])];let body=lines.map(row=>row.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');if(window.DBCNative&&typeof window.DBCNative.shareText==='function'){window.DBCNative.shareText('dbc-demo-trips.csv',body)}else if(navigator.clipboard&&location.protocol!=='file:'){navigator.clipboard.writeText(body).then(()=>notify('CSV copied to clipboard')).catch(()=>notify('Copy unavailable'))}else{window.prompt('Copy CSV',body)}}
function run(action){switch(action){case 'lang':st.language=st.language==='ar'?'en':'ar';break;case 'mode':st.mode=st.mode==='demo'?'offline':'demo';break;case 'edit':notify(t('Open Settings to change layout preferences.','افتح الإعدادات لتغيير خيارات الواجهة.'));st.page='settings';break;case 'startTrip':st.currentTrip={start:Date.now()};notify(t('Started local demo trip timer.','بدأ مؤقت رحلة تجريبية محلية.'));break;case 'endTrip':if(st.currentTrip){st.trips.unshift({id:Date.now(),start:st.currentTrip.start,end:Date.now(),distance:''});st.currentTrip=null;notify(t('Saved demo trip.','انحفظت الرحلة التجريبية.'))}break;case 'addTrip':st.trips.unshift({id:Date.now(),start:Date.now()-1500000,end:Date.now(),distance:'12.3'});notify(t('Added sample record — NOT actual mileage.','أضيف سجل نموذجي، مو مسافة فعلية.'));break;case 'clearTrips':if(confirm(t('Remove all local demo trips?','تمسح كل الرحلات التجريبية؟'))){st.trips=[];st.currentTrip=null}break;case 'saveTariff':st.tariff=$('tariff')?.value||'';notify(t('Saved locally.','انحفظ محلياً.'));break;case 'exportTrips':csv();break;case 'diagnostics':{let text='DBC Independent v1.1.0\nMode:'+st.mode+'\nTrips:'+st.trips.length+'\nVehicle connected:NO';if(window.DBCNative)window.DBCNative.shareText('dbc-diagnostics.txt',text);else window.prompt('Copy diagnostics',text);break}case 'refresh':case 'previewOptimize':case 'otaCheck':case 'esim':case 'apn':notify(t('Offline preview only — no vehicle or system action.','معاينة بدون اتصال — ما صار أي أمر على السيارة أو النظام.'));break;default:notify(t('This feature requires documented integration; not available in demo.','هذه الوظيفة تحتاج ربط موثّق، وغير متاحة بالتجربة.'))}render()}
document.addEventListener('click',ev=>{let p=ev.target.closest('[data-page]');if(p){st.page=p.dataset.page;st.selectedTab='logs';menu(true);render();return}let a=ev.target.closest('[data-action]');if(a){run(a.dataset.action);return}let f=ev.target.closest('[data-filter]');if(f){st.filter=f.dataset.filter;render();return}let tb=ev.target.closest('[data-tab]');if(tb){st.selectedTab=tb.dataset.tab;render();return}let th=ev.target.closest('[data-theme]');if(th){st.theme=th.dataset.theme;render();return}});
document.addEventListener('change',ev=>{let k=ev.target.dataset.setting;if(k){st.settings[k]=!!ev.target.checked;save();notify(t('Preference saved locally.','الإعداد انحفظ محلياً.'))}if(ev.target.id==='langpick'){st.language=ev.target.value;render()}if(ev.target.id==='scalepick'){st.scale=Number(ev.target.value);render()}});
$('menuBtn').onclick=()=>menu();$('shade').onclick=()=>menu(true);document.addEventListener('keydown',e=>{if(e.key==='Escape'){menu(true)}});window.addEventListener('error',e=>{const x=$('toast');if(x){x.textContent='UI error: '+String(e.message).slice(0,160);x.classList.add('show')}});render();
</script></body></html>
