name: motora
description: "زيد للسيارات - إدارة السيارات والعقود"
publish_to: "none"
version: 1.0.38+2038

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/contract_designer.html
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/original/Cairo.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/original/Tajawal.ttf
    - family: Almarai
      fonts:
        - asset: assets/fonts/original/Almarai.ttf
    - family: Changa
      fonts:
        - asset: assets/fonts/original/Changa.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/original/Amiri.ttf
    - family: Naskh
      fonts:
        - asset: assets/fonts/original/NotoNaskhArabic-Regular.ttf
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/original/ReemKufi.ttf
    - family: NotoArabic
      fonts:
        - asset: assets/fonts/original/NotoSansArabic-Regular.ttf
    - family: ElMessiri
      fonts:
        - asset: assets/fonts/original/ElMessiri.ttf
    - family: Markazi
      fonts:
        - asset: assets/fonts/original/Markazi.ttf
